- title: Research Experience
  type: nested_list
  contents:
    - title: Joint Constraints on Primordial Non-Gaussianity from 21 cm HI Intensity Mapping and CMB (Lead author, manuscript in preparation)
      year: 2024 — present
      description:
        - Combines SKA MID Band 1 21 cm intensity mapping with Planck CMB data to constrain local-type primordial non-Gaussianity
        - Employs a non-negativity constraint method to recover large-scale modes from small-scale measurements, addressing the foreground contamination challenge in 21 cm cosmology
        - Forecasts show σ(f_NL) ∼ 2.3 from joint analysis, a factor of ∼2.2 improvement over CMB alone (σ(f_NL) = 5.1), over z=0.35–3 with 25,000 deg² sky coverage
        - Theoretical foundation built on the scale-dependent bias effect of primordial non-Gaussianity on large-scale structure

